<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Venom Games – Auth Hub</title>
  <style>html,body{margin:0;padding:0;background:transparent}</style>
</head>
<body>
<!--
  Venom Games shared auth hub.
  Games embed this page as a hidden <iframe allow="storage-access">.
  Cross-origin session sharing is done via window.postMessage.

  Chrome 115+ Third-Party Storage Partitioning would silo this iframe's
  localStorage from the first-party MG context.  We work around it with
  the Storage Access API: requestStorageAccess() grants the iframe access
  to its UNPARTITIONED storage (same bucket as the MG top-level page).
  Chrome auto-grants this when the user has previously visited MG directly.

  Supported messages (sent TO this iframe):
    { type: 'VG_SET_SESSION', session: { access_token, refresh_token } }
    { type: 'VG_GET_SESSION' }
    { type: 'VG_CLEAR_SESSION' }

  Responses (posted BACK to the sender):
    { type: 'VG_SESSION_SET' }
    { type: 'VG_SESSION_RESULT', session: <object|null> }
    { type: 'VG_SESSION_CLEARED' }

  On load, the hub also broadcasts VG_HUB_READY to parent.

  To add a new game: append its prod origin and dev localhost to TRUSTED below.
-->
<script>
(function () {
  'use strict';

  /* ── Trusted game origins ──────────────────────────────────────── */
  var TRUSTED = [
    'https://mountain-goats.onrender.com',
    'https://flip7-6eif.onrender.com',
    'http://localhost:3000',
    'http://localhost:3003',
    // Add new games here:
    // 'https://new-game.onrender.com',
    // 'http://localhost:3001',
  ];

  var STORAGE_KEY = 'vg_shared_session';

  /* ── Storage Access API ────────────────────────────────────────── */
  // Resolves once unpartitioned storage access is confirmed (or times out).
  var _accessReady = (function () {
    if (!document.requestStorageAccess) return Promise.resolve();
    return document.hasStorageAccess().then(function (has) {
      if (has) return;
      return document.requestStorageAccess();
    }).catch(function () {
      // Denied or unsupported — fall back to partitioned storage.
    });
  }());

  /* ── Storage helpers ───────────────────────────────────────────── */
  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }
    catch (e) { return null; }
  }

  function save(session) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        access_token:  session.access_token,
        refresh_token: session.refresh_token,
        saved_at:      Date.now(),
      }));
    } catch (e) { /* storage full or blocked */ }
  }

  function clear() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
  }

  /* ── Message handler ───────────────────────────────────────────── */
  window.addEventListener('message', function (e) {
    if (TRUSTED.indexOf(e.origin) === -1) return;
    var msg = e.data;
    if (!msg || typeof msg !== 'object') return;

    // Wait for storage access before touching localStorage.
    var src    = e.source;
    var origin = e.origin;
    _accessReady.then(function () {
      switch (msg.type) {
        case 'VG_SET_SESSION':
          if (msg.session && msg.session.access_token && msg.session.refresh_token) {
            save(msg.session);
          }
          src.postMessage({ type: 'VG_SESSION_SET' }, origin);
          break;

        case 'VG_GET_SESSION':
          src.postMessage({ type: 'VG_SESSION_RESULT', session: load() }, origin);
          break;

        case 'VG_CLEAR_SESSION':
          clear();
          src.postMessage({ type: 'VG_SESSION_CLEARED' }, origin);
          break;
      }
    });
  });

  /* ── Signal ready ──────────────────────────────────────────────── */
  // Signal only after storage access is resolved so the parent knows
  // the hub is ready to serve accurate results.
  _accessReady.then(function () {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'VG_HUB_READY' }, '*');
    }
  });
})();
</script>
</body>
</html>
